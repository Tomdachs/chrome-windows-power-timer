<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows Power Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <div class="eyebrow">WINDOWS POWER TIMER</div>
      <h1>電源タイマー</h1>
    </header>

    <section class="time-grid" aria-label="タイマー時間">
      <label>HOURS
        <input id="hours" type="number" min="0" max="168" step="1" value="0" inputmode="numeric">
      </label>
      <label>MINUTES
        <input id="minutes" type="number" min="0" max="59" step="1" value="30" inputmode="numeric">
      </label>
    </section>

    <div class="presets" aria-label="プリセット">
      <button type="button" data-minutes="5">5m</button>
      <button type="button" data-minutes="15">15m</button>
      <button type="button" data-minutes="30">30m</button>
      <button type="button" data-minutes="60">1h</button>
    </div>

    <fieldset>
      <legend>実行する動作</legend>
      <label class="action-option">
        <input type="radio" name="action" value="sleep" checked>
        <span><strong>スリープ</strong><small>Windowsをスリープ状態にする</small></span>
      </label>
      <label class="action-option danger-option">
        <input type="radio" name="action" value="shutdown">
        <span><strong>シャットダウン</strong><small>Windowsを終了する</small></span>
      </label>
    </fieldset>

    <button id="start" class="primary" type="button">タイマー開始</button>
    <button id="cancel" class="secondary hidden" type="button">タイマーをキャンセル</button>

    <section id="running" class="running hidden" aria-live="polite">
      <span>残り時間</span>
      <strong id="countdown">--:--</strong>
      <small id="runningAction"></small>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
    <footer>
      <span id="hostStatus" class="dot unknown"></span>
      <span id="hostText">Windows host を確認中…</span>
    </footer>
    <p class="note">タイマー実行時までChromeが起動している必要があります。</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
