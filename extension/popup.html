<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows Power Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <div class="eyebrow">WINDOWS POWER TIMER</div>
      <h1 data-i18n="powerTimer">Power timer</h1>
    </header>

    <section class="time-grid" data-i18n-aria="timerDuration" aria-label="Timer duration">
      <label>HOURS
        <input id="hours" type="number" min="0" max="168" step="1" value="0" inputmode="numeric">
      </label>
      <label>MINUTES
        <input id="minutes" type="number" min="0" max="59" step="1" value="30" inputmode="numeric">
      </label>
    </section>

    <div class="presets" data-i18n-aria="presets" aria-label="Presets">
      <button type="button" data-minutes="5">5m</button>
      <button type="button" data-minutes="15">15m</button>
      <button type="button" data-minutes="30">30m</button>
      <button type="button" data-minutes="60">1h</button>
    </div>

    <fieldset>
      <legend data-i18n="actionLegend">Power action</legend>
      <label class="action-option">
        <input type="radio" name="action" value="sleep" checked>
        <span><strong data-i18n="sleep">Sleep</strong><small data-i18n="sleepDescription">Put Windows to sleep</small></span>
      </label>
      <label class="action-option danger-option">
        <input type="radio" name="action" value="shutdown">
        <span><strong data-i18n="shutdown">Shut down</strong><small data-i18n="shutdownDescription">Shut down Windows</small></span>
      </label>
    </fieldset>

    <button id="start" class="primary" type="button" data-i18n="startTimer">Start timer</button>
    <button id="cancel" class="secondary hidden" type="button" data-i18n="cancelTimer">Cancel timer</button>

    <section id="running" class="running hidden" aria-live="polite">
      <span data-i18n="timeRemaining">Time remaining</span>
      <strong id="countdown">--:--</strong>
      <small id="runningAction"></small>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
    <footer>
      <span id="hostStatus" class="dot unknown"></span>
      <span id="hostText" data-i18n="checkingHost">Checking Windows host…</span>
    </footer>
    <p class="note" data-i18n="chromeRunningNote">Chrome must still be running when the timer expires.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
