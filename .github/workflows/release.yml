name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Test and validate assets
        run: |
          npm test
          python tests/validate_store_assets.py
          python scripts/package_web_store.py
      - name: Build and ping native host
        shell: powershell
        run: |
          .\scripts\build-host.ps1
          python .\tests\host_ping.py .\dist\windows-power-host.exe
      - name: Package
        shell: powershell
        run: .\scripts\package-release.ps1 -Version $env:GITHUB_REF_NAME
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem .\dist\chrome-windows-power-timer-*.zip | Select-Object -First 1
          $sha = Get-ChildItem .\dist\chrome-windows-power-timer-*.zip.sha256 | Select-Object -First 1
          $storeZip = Get-ChildItem .\dist\web-store\windows-power-timer-*.zip | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $zip.FullName $sha.FullName $storeZip.FullName `
            --title $env:GITHUB_REF_NAME --generate-notes
